<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c0b38"/><stop offset="1" stop-color="#05030c"/></linearGradient>
<radialGradient id="halo" cx="50%" cy="56%" r="46%"><stop offset="0" stop-color="#ff3fd2" stop-opacity=".30"/><stop offset=".6" stop-color="#7c3aed" stop-opacity=".12"/><stop offset="1" stop-color="#05030c" stop-opacity="0"/></radialGradient>
<linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6be4"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
<linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff4fd8"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur in="SourceGraphic" stdDeviation="11" result="wide"/><feGaussianBlur in="SourceGraphic" stdDeviation="4" result="near"/><feMerge><feMergeNode in="wide"/><feMergeNode in="wide"/><feMergeNode in="near"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
<circle cx="256" cy="286" r="230" fill="url(#halo)"/>
<!-- sound rising from the Bible -->
