<g stroke="#ffd1f5" stroke-opacity=".75" stroke-width="5" stroke-linecap="round"><path d="M162 276 L230 282 M162 300 L230 306 M162 324 L214 329"/><path d="M282 282 L350 276 M282 306 L350 300 M298 329 L350 324"/></g>
