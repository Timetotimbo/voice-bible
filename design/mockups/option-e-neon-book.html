<title>Voice Bible Neon Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  /* Neon Hub colours: magenta and cyan glowing on violet-black (one deliberate night look) */
  :root {
    --bg: #09050f;
    --tile: #130b1f;
    --tile-2: #1c1130;
    --line: #2d1d48;
    --text: #f2eaff;
    --soft: #b3a3cf;
    --faint: #7a6a96;
    --pink: #ff3fd8;
    --cyan: #22e3ff;
    --glow-p: rgba(255, 63, 216, 0.45);
    --glow-c: rgba(34, 227, 255, 0.4);
    --ui: 'Exo 2', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --read: 'Spectral', Georgia, 'Times New Roman', serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font: 15.5px/1.5 var(--ui); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  svg { display: block; }
  .ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  .app { height: 100%; max-width: 460px; margin: 0 auto; position: relative; display: flex; flex-direction: column; overflow: hidden;
    background: radial-gradient(120% 50% at 50% -10%, rgba(255, 63, 216, 0.15), transparent 60%), var(--bg); }
  .app::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--pink), var(--cyan)); box-shadow: 0 0 12px var(--glow-p), 0 0 22px var(--glow-c); z-index: 5; }

  /* Top: name, translation, settings, and the glowing search bar on every screen */
  .top { padding: 12px 16px 10px; display: grid; gap: 10px; }
  .head { display: flex; align-items: center; gap: 10px; }
  .head h1 { flex: 1; margin: 0; font-size: 1.3rem; font-weight: 800; letter-spacing: 0.03em;
    background: linear-gradient(90deg, var(--pink), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 8px rgba(255, 63, 216, 0.35)); }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 0.8rem; font-weight: 700; color: var(--soft); }
  .round { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--soft); border: 1px solid var(--line); flex: none; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--tile); border: 1px solid var(--pink); border-radius: 16px; padding: 5px 5px 5px 14px;
    box-shadow: 0 0 14px rgba(255, 63, 216, 0.25), inset 0 0 12px rgba(255, 63, 216, 0.08); }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--text); font: inherit; padding: 9px 0; }
  .search input::placeholder { color: var(--faint); }
  .mic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, var(--pink), #b43cff); color: #fff; box-shadow: 0 0 16px var(--glow-p); flex: none; }
  .mic svg { width: 22px; height: 22px; fill: currentColor; }
  .mic.on { animation: pulse 1.2s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--glow-p); } 100% { box-shadow: 0 0 0 18px transparent; } }

  main { flex: 1; overflow-y: auto; padding: 0 18px 20px; }
  .hint { color: var(--faint); font-size: 0.8rem; margin: 0 0 12px; }
  body.nohints .hint { display: none; }

  /* Read: the Open Book page */
  .chapter-head { text-align: center; margin: 6px 0 14px; position: relative; }
  .chapter-head .book { font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--cyan); font-weight: 800; }
  .chapter-head .num { font-family: var(--read); font-size: 3.3rem; line-height: 1.05; font-weight: 600; color: var(--text); text-shadow: 0 0 18px rgba(255, 63, 216, 0.45); }
  .chapter-head .sub { font-family: var(--read); font-style: italic; color: var(--soft); }
  .chapter-head .pick { position: absolute; right: 0; top: 4px; }
  .text { font-family: var(--read); font-size: 1.16rem; line-height: 1.85; max-width: 62ch; margin: 0 auto; }
  .v { border-radius: 6px; padding: 2px 3px; margin: 0 -3px; cursor: pointer; transition: background 0.15s; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .v sup { font-family: var(--ui); font-size: 0.62rem; font-weight: 800; color: var(--pink); margin-right: 3px; vertical-align: 0.6em; }
  .v.sel { background: rgba(34, 227, 255, 0.12); text-decoration: underline; text-decoration-color: var(--cyan); text-underline-offset: 5px; text-decoration-thickness: 2px; }
  .v.now { background: rgba(255, 63, 216, 0.18); }
  .pager { display: flex; justify-content: space-between; gap: 10px; margin: 22px 0 4px; }
  .pager button { border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; color: var(--soft); font-weight: 700; font-size: 0.88rem; }
  .pager button:disabled { opacity: 0.35; cursor: default; }

  /* Search results, list verses */
  .meta { display: flex; align-items: center; gap: 10px; margin: 2px 0 10px; }
  .meta h2 { flex: 1; margin: 0; font-size: 0.98rem; font-weight: 700; color: var(--soft); }
  .meta h2 b { color: var(--text); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
  .seg button { padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; color: var(--soft); font-weight: 700; }
  .seg button.on { background: var(--tile-2); color: var(--cyan); }
  .vcard { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 8px; cursor: pointer; background: var(--tile); transition: border-color 0.15s, box-shadow 0.15s; }
  .vcard.sel { border-color: var(--cyan); box-shadow: 0 0 10px rgba(34, 227, 255, 0.25); }
  .vcard.now { border-color: var(--pink); box-shadow: 0 0 12px rgba(255, 63, 216, 0.3); }
  .vcard .r { font-size: 0.8rem; font-weight: 800; color: var(--cyan); }
  .vcard p { margin: 2px 0 0; font-family: var(--read); font-size: 1.06rem; line-height: 1.55; }
  mark { background: rgba(255, 63, 216, 0.22); color: inherit; border-radius: 3px; padding: 0 2px; }
  .label { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--cyan); margin: 18px 0 8px; }
  .hist { display: flex; flex-wrap: wrap; gap: 6px; }
  .hist button { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 0.86rem; color: var(--soft); }

  /* Lists and notes */
  .titlebar { display: flex; align-items: center; gap: 8px; margin: 2px 0 8px; }
  .titlebar h2 { flex: 1; min-width: 0; margin: 0; font-size: 1.15rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .titlebar h2 small { color: var(--faint); font-weight: 600; font-size: 0.8rem; margin-left: 6px; }
  .text-btn { color: var(--cyan); font-weight: 800; font-size: 0.9rem; padding: 6px 4px; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .row { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
  .row > button.main { flex: 1; min-width: 0; text-align: left; padding: 13px 2px; display: grid; }
  .row .t { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s { font-size: 0.84rem; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .handle, .row .del { display: none; width: 32px; height: 32px; place-items: center; border-radius: 8px; color: var(--faint); }
  .row .del { color: var(--pink); }
  .editing .row .handle, .editing .row .del { display: grid; }
  .count { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 0.85rem; }
  .editing .count { display: none; }
  .new-btn { width: 100%; text-align: left; padding: 13px 2px; color: var(--pink); font-weight: 800; border-bottom: 1px solid var(--line); }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .nb { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 0.84rem; font-weight: 700; color: var(--soft); display: inline-flex; align-items: center; gap: 6px; }
  .nb.hot { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 10px rgba(34, 227, 255, 0.25); }
  .note-title { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--text); font: 800 1.2rem var(--ui); padding: 4px 0 10px; outline: none; margin-bottom: 10px; }
  textarea.note { width: 100%; min-height: 46vh; background: none; border: 0; color: var(--text); font: 1.06rem/1.7 var(--read); outline: none; resize: none; }

  /* Chat */
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 16px; margin-bottom: 10px; white-space: pre-wrap; line-height: 1.5; }
  .msg.me { margin-left: auto; background: linear-gradient(135deg, var(--pink), #b43cff); color: #fff; border-bottom-right-radius: 4px; }
  .msg.ai { background: var(--tile); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg .ref { color: var(--cyan); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .composer { display: flex; gap: 8px; padding: 8px 16px 10px; border-top: 1px solid var(--line); }
  .composer input { flex: 1; min-width: 0; background: var(--tile); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; color: var(--text); font: inherit; outline: none; }
  .composer button { border-radius: 12px; padding: 0 16px; font-weight: 800; background: linear-gradient(135deg, var(--pink), #b43cff); color: #fff; }

  /* Play strip and selection strip, above the tabs */
  .strip { border-top: 1px solid var(--line); background: rgba(9, 5, 15, 0.96); padding: 8px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .strip .main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border-radius: 12px; padding: 11px 14px; font-weight: 800;
    background: linear-gradient(90deg, var(--pink), #b43cff); color: #fff; box-shadow: 0 0 14px var(--glow-p); }
  .strip .main span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip .main small { margin-left: auto; opacity: 0.85; font-variant-numeric: tabular-nums; }
  .strip .ctl { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); display: grid; place-items: center; font-weight: 800; font-size: 0.85rem; color: var(--soft); flex: none; }
  .strip .ctl.on { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 10px rgba(34, 227, 255, 0.3); }
  .strip .countlbl { font-weight: 800; margin-right: auto; }

  /* Tabs (from Option A) */
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); background: var(--bg); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .tabs button { display: grid; justify-items: center; gap: 2px; padding: 4px 0; font-size: 0.7rem; font-weight: 700; color: var(--faint); }
  .tabs .ico { width: 22px; height: 22px; }
  .tabs button.on { color: var(--text); }
  .tabs button.on .ico { color: var(--pink); filter: drop-shadow(0 0 6px var(--glow-p)); }

  .scrim { position: absolute; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.6); display: flex; align-items: flex-end; }
  .sheet { width: 100%; background: var(--tile); border-top: 1px solid var(--pink); box-shadow: 0 -6px 24px rgba(255, 63, 216, 0.2); border-radius: 22px 22px 0 0; padding: 10px 16px calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 82%; overflow-y: auto; }
  .sheet h3 { margin: 4px 0 10px; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 13px 2px; border-bottom: 1px solid var(--line); font-weight: 700; }
  .opt small { margin-left: auto; color: var(--faint); }
  .sw { width: 42px; height: 24px; border-radius: 999px; background: var(--tile-2); border: 1px solid var(--line); position: relative; margin-left: auto; flex: none; }
  .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--faint); transition: transform 0.2s; }
  .sw.on { border-color: var(--cyan); box-shadow: 0 0 8px rgba(34, 227, 255, 0.4); }
  .sw.on::after { transform: translateX(18px); background: var(--cyan); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-weight: 700; }
  .toast { position: absolute; left: 16px; right: 16px; top: 120px; z-index: 30; background: var(--tile-2); border: 1px solid var(--cyan); border-radius: 12px; padding: 11px 14px; font-size: 0.9rem; box-shadow: 0 0 16px rgba(34, 227, 255, 0.25); }
  .proto { text-align: center; color: var(--faint); font-size: 0.72rem; margin-top: 22px; }
  @media (prefers-reduced-motion: reduce) { .mic.on { animation: none; } .v, .vcard, .sw::after { transition: none; } }
</style>

<div class="app" id="app">
  <header class="top">
    <div class="head">
      <h1>Voice Bible</h1>
      <button class="chip" id="tr" aria-label="Translation">KJV ▾</button>
      <button class="round" id="settings" aria-label="Settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg></button>
    </div>
    <form class="search" id="sform">
      <input id="q" placeholder="Search a word, or John 3:16" aria-label="Search the Bible" autocomplete="off">
      <button type="button" class="mic" id="mic" aria-label="Speak a search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg></button>
    </form>
  </header>
  <main id="main"></main>
  <div id="dock"></div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <div id="layer"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ico = d => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const I = {
  read: '<path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5Zm0 0v13"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  lists: '<path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/>',
  notes: '<path d="M5 4h10l4 4v12H5Z"/><path d="M15 4v4h4M8 12h8M8 16h6"/>',
  chat: '<path d="M4 5h16v11H9l-5 4Z"/>',
  back: '<path d="m15 18-6-6 6-6"/>',
};

// Sample text (KJV, public domain)
const BOOK = {
  'Psalms 23': { sub: 'A Psalm of David.', v: [
    'The LORD is my shepherd; I shall not want.',
    'He maketh me to lie down in green pastures: he leadeth me beside the still waters.',
    'He restoreth my soul: he leadeth me in the paths of righteousness for his name’s sake.',
    'Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me; thy rod and thy staff they comfort me.',
    'Thou preparest a table before me in the presence of mine enemies: thou anointest my head with oil; my cup runneth over.',
    'Surely goodness and mercy shall follow me all the days of my life: and I will dwell in the house of the LORD for ever.'] },
  'Psalms 24': { sub: 'A Psalm of David.', v: [
    'The earth is the LORD’S, and the fulness thereof; the world, and they that dwell therein.',
    'For he hath founded it upon the seas, and established it upon the floods.',
    'Who shall ascend into the hill of the LORD? or who shall stand in his holy place?',
    'He that hath clean hands, and a pure heart; who hath not lifted up his soul unto vanity, nor sworn deceitfully.',
    'He shall receive the blessing from the LORD, and righteousness from the God of his salvation.',
    'This is the generation of them that seek him, that seek thy face, O Jacob. Selah.'] },
  'Hebrews 11': { sub: 'The faith chapter.', v: [
    'Now faith is the substance of things hoped for, the evidence of things not seen.',
    'For by it the elders obtained a good report.',
    'Through faith we understand that the worlds were framed by the word of God, so that things which are seen were not made of things which do appear.',
    'By faith Abel offered unto God a more excellent sacrifice than Cain, by which he obtained witness that he was righteous, God testifying of his gifts: and by it he being dead yet speaketh.',
    'By faith Enoch was translated that he should not see death; and was not found, because God had translated him: for before his translation he had this testimony, that he pleased God.',
    'But without faith it is impossible to please him: for he that cometh to God must believe that he is, and that he is a rewarder of them that diligently seek him.'] },
};
const ORDER = ['Hebrews 11', 'Psalms 23', 'Psalms 24'];
const FAITH = [
  ['Hebrews 11:1', 'Now faith is the substance of things hoped for, the evidence of things not seen.', 'Hebrews 11', 0],
  ['Romans 10:17', 'So then faith cometh by hearing, and hearing by the word of God.'],
  ['2 Corinthians 5:7', '(For we walk by faith, not by sight:)'],
  ['Ephesians 2:8', 'For by grace are ye saved through faith; and that not of yourselves: it is the gift of God:'],
  ['Hebrews 11:6', 'But without faith it is impossible to please him: for he that cometh to God must believe that he is, and that he is a rewarder of them that diligently seek him.', 'Hebrews 11', 5],
  ['Mark 11:22', 'And Jesus answering saith unto them, Have faith in God.'],
  ['James 2:17', 'Even so faith, if it hath not works, is dead, being alone.'],
];
const LISTS = [
  { name: 'Faith', verses: FAITH.slice(0, 4) },
  { name: 'Peace', verses: [['John 14:27', 'Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid.'], ['Philippians 4:7', 'And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus.'], ['Isaiah 26:3', 'Thou wilt keep him in perfect peace, whose mind is stayed on thee: because he trusteth in thee.']] },
  { name: 'Sunday readings', verses: BOOK['Psalms 23'].v.slice(0, 3).map((t, i) => [`Psalm 23:${i + 1}`, t]) },
];
const NOTES = [
  { title: 'Walking by faith', text: 'Sunday sermon.\n\nFaith is trusting what God has said before we can see it.\n\n2 Corinthians 5:7 (KJV)\n(For we walk by faith, not by sight:)' },
  { title: 'Prayer list', text: 'Mom’s surgery on Thursday.\nThe youth retreat.\nWisdom for the new job.' },
];
const CHAT = [
  ['me', 'What does the Bible say about fear?'],
  ['ai', 'Scripture meets fear with a promise that God is near.\n\n[Psalm 23:4] pictures walking through the darkest valley without fear, because the Lord is with us.\n\n[Hebrews 11:6] reminds us that God rewards those who seek him.'],
];

let S = { tab: 'read', at: 'Psalms 23', query: '', mode: 'words', sel: new Set(), playing: false, now: -1, repeat: false, speed: 1, list: null, note: null, editing: false, hints: true, listening: false };
let timer = 0, tt = 0;

function toast(m) { clearTimeout(tt); $('.toast')?.remove(); const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = m; $('#app').append(t); tt = setTimeout(() => t.remove(), 2600); }
function hi(t, q) { const w = q.replace(/[^\w ]/g, '').split(' ').filter(Boolean); return w.length ? esc(t).replace(new RegExp(`\\b(${w.join('|')})\\b`, 'gi'), '<mark>$1</mark>') : esc(t); }
function items() {
  if (S.tab === 'read') return BOOK[S.at].v.map((t, i) => [`${S.at.replace('Psalms', 'Psalm')}:${i + 1}`, t]);
  if (S.tab === 'search' && S.query) return FAITH;
  if (S.tab === 'lists' && S.list !== null) return LISTS[S.list].verses;
  return [];
}
function stop() { clearInterval(timer); S.playing = false; S.now = -1; }
function play(only) {
  const all = items(); if (!all.length) return;
  const order = only ?? all.map((_, i) => i); let k = 0;
  S.playing = true; S.now = order[0]; S.sel.clear(); render();
  clearInterval(timer);
  timer = setInterval(() => {
    k++;
    if (k >= order.length) {
      if (S.repeat) k = 0;
      else if (!only && S.tab === 'read' && ORDER.indexOf(S.at) < ORDER.length - 1) { S.at = ORDER[ORDER.indexOf(S.at) + 1]; render(); $('#main').scrollTop = 0; return play(); }
      else { stop(); return render(); }
    }
    S.now = order[k]; render();
    document.querySelector('.now')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }, 2400 / S.speed);
}
function setTab(t) { stop(); S.tab = t; S.sel.clear(); S.editing = false; if (t === 'lists') S.list = null; if (t === 'notes') S.note = null; render(); $('#main').scrollTop = 0; }
function openAt(place, verse) { stop(); S.tab = 'read'; S.at = place; S.sel.clear(); if (verse !== undefined) S.sel.add(verse); render(); $('#main').scrollTop = 0; if (verse !== undefined) document.querySelector(`.v[data-i="${verse}"]`)?.scrollIntoView({ block: 'center' }); }
function search(q) { stop(); S.tab = 'search'; S.query = q || 'faith'; S.sel.clear(); $('#q').value = S.query; render(); $('#main').scrollTop = 0; }

function renderMain() {
  const m = $('#main');
  if (S.tab === 'read') {
    const [book, num] = S.at.split(' '); const i = ORDER.indexOf(S.at);
    m.innerHTML = `
      <div class="chapter-head"><div class="book">${esc(book)}</div><div class="num">${num}</div><div class="sub">${esc(BOOK[S.at].sub)}</div>
        <button class="chip pick" id="pick" aria-label="Go to a book and chapter">Go to ▾</button></div>
      <p class="hint" style="text-align:center">Tap verses to choose them. Tap the mic to search by voice.</p>
      <div class="text">${BOOK[S.at].v.map((t, k) => `<span class="v ${S.sel.has(k) ? 'sel' : ''} ${S.now === k ? 'now' : ''}" data-i="${k}" role="button" tabindex="0" aria-pressed="${S.sel.has(k)}"><sup>${k + 1}</sup>${esc(t)}</span> `).join('')}</div>
      <div class="pager"><button id="prev" ${i ? '' : 'disabled'}>‹ ${i ? esc(ORDER[i - 1]) : 'Previous'}</button><button id="next" ${i < ORDER.length - 1 ? '' : 'disabled'}>${i < ORDER.length - 1 ? esc(ORDER[i + 1]) : 'Next'} ›</button></div>
      <p class="proto">Clickable prototype · Option E (Neon Book) · sample chapters</p>`;
    return;
  }
  if (S.tab === 'search') {
    if (!S.query) {
      m.innerHTML = `<p class="hint">Type above, or tap the mic and say a word, a phrase or a verse.</p>
        <div class="label">Recent</div><div class="hist">${['faith', 'Psalm 23', 'love your enemies', 'peace', 'Hebrews 11'].map(h => `<button data-h="${esc(h)}">${esc(h)}</button>`).join('')}</div>`;
      return;
    }
    m.innerHTML = `<div class="meta"><h2><b>${FAITH.length}</b> verses with “${esc(S.query)}”</h2>
      <div class="seg" role="radiogroup" aria-label="Match"><button class="${S.mode === 'words' ? 'on' : ''}" data-mode="words">All words</button><button class="${S.mode === 'exact' ? 'on' : ''}" data-mode="exact">Exact</button></div></div>
      <p class="hint">Tap verses to choose them. Double-tap one to open its chapter.</p>
      ${FAITH.map(([r, t], i) => `<div class="vcard ${S.sel.has(i) ? 'sel' : ''} ${S.now === i ? 'now' : ''}" data-i="${i}" role="button" tabindex="0"><div class="r">${esc(r)}</div><p>${hi(t, S.query)}</p></div>`).join('')}`;
    return;
  }
  if (S.tab === 'lists') {
    if (S.list !== null) {
      const l = LISTS[S.list];
      m.innerHTML = `<div class="titlebar"><button class="round" id="back-lists" aria-label="Back">${ico(I.back)}</button><h2>${esc(l.name)}<small>${l.verses.length} verses</small></h2></div>
        ${l.verses.map(([r, t], i) => `<div class="vcard ${S.sel.has(i) ? 'sel' : ''} ${S.now === i ? 'now' : ''}" data-i="${i}" role="button" tabindex="0"><div class="r">${esc(r)}</div><p>${esc(t)}</p></div>`).join('')}`;
      return;
    }
    m.innerHTML = `<div class="titlebar"><h2>Verse Lists</h2><button class="text-btn" id="edit">${S.editing ? 'Done' : 'Edit'}</button></div>
      <div class="${S.editing ? 'editing' : ''}"><button class="new-btn" id="newlist">＋ New list</button><ul class="rows">${LISTS.map((l, i) => `
        <li class="row"><span class="handle" aria-hidden="true">⠿</span><button class="main" data-list="${i}"><span class="t">${esc(l.name)}</span><span class="s">${esc(l.verses.map(v => v[0]).join(' · '))}</span></button>
        <span class="count">${l.verses.length}</span><button class="del" aria-label="Delete ${esc(l.name)}">✕</button></li>`).join('')}</ul></div>`;
    return;
  }
  if (S.tab === 'notes') {
    if (S.note !== null) {
      const n = NOTES[S.note];
      m.innerHTML = `<div class="titlebar"><button class="round" id="back-notes" aria-label="Back">${ico(I.back)}</button><h2>Note</h2></div>
        <input class="note-title" value="${esc(n.title)}" aria-label="Title">
        <div class="tools"><button class="nb hot" data-soon="Dictation goes where your cursor is.">🎙 Dictate</button><button class="nb" data-soon="Reads the note aloud, with Loop and speed.">▶ Listen</button><button class="nb" data-soon="Insert a verse, a list or a chat.">＋ Insert</button><button class="nb" aria-label="Undo">↶</button><button class="nb" aria-label="Redo">↷</button></div>
        <textarea class="note" aria-label="Note">${esc(n.text)}</textarea>`;
      return;
    }
    m.innerHTML = `<div class="titlebar"><h2>Notes</h2><button class="text-btn" id="edit">${S.editing ? 'Done' : 'Edit'}</button></div>
      <div class="${S.editing ? 'editing' : ''}"><button class="new-btn" id="newnote">＋ New note</button><ul class="rows">${NOTES.map((n, i) => `
        <li class="row"><span class="handle" aria-hidden="true">⠿</span><button class="main" data-note="${i}"><span class="t">${esc(n.title)}</span><span class="s">${esc(n.text.replace(/\n+/g, ' '))}</span></button>
        <button class="del" aria-label="Delete ${esc(n.title)}">✕</button></li>`).join('')}</ul></div>`;
    return;
  }
  if (S.tab === 'chat') {
    m.innerHTML = `<div class="titlebar"><h2>Fear<small>ChatGPT</small></h2><button class="text-btn" data-soon="Reads the chat aloud, message by message.">▶ Listen</button></div>
      ${CHAT.map(([who, text]) => `<div class="msg ${who}">${esc(text).replace(/\[([^\]]+)\]/g, '<span class="ref" data-ref="$1">$1</span>')}</div>`).join('')}`;
  }
}

function renderDock() {
  const d = $('#dock');
  if (S.tab === 'chat') { d.innerHTML = `<form class="composer" id="cform"><input id="cq" placeholder="Ask ChatGPT, or speak…" aria-label="Message" autocomplete="off"><button>Send</button></form>`; return; }
  const all = items();
  if (!all.length) { d.innerHTML = ''; return; }
  if (S.sel.size) {
    d.innerHTML = `<div class="strip"><span class="countlbl">${S.sel.size} chosen</span><button class="nb hot" id="playsel">▶ Play</button><button class="nb" id="save">${S.tab === 'lists' ? 'Copy' : 'Save'}</button><button class="nb" id="tonote">To note</button><button class="nb" id="share">Share</button><button class="nb" id="clear" aria-label="Clear">✕</button></div>`;
    return;
  }
  const label = S.playing ? all[S.now][0] : S.tab === 'read' ? `Play ${S.at}` : `Play all ${all.length}`;
  d.innerHTML = `<div class="strip"><button class="main" id="play">${S.playing ? '❚❚' : '▶'} <span>${esc(label)}</span>${S.playing ? `<small>${S.now + 1}/${all.length}</small>` : ''}</button>
    <button class="ctl ${S.repeat ? 'on' : ''}" id="repeat" aria-label="Repeat" aria-pressed="${S.repeat}">⟳</button><button class="ctl" id="speed" aria-label="Speed">${S.speed}×</button><button class="ctl" id="more" aria-label="More playback options">⋯</button></div>`;
}

function renderTabs() {
  const t = [['read', 'Read'], ['search', 'Search'], ['lists', 'Lists'], ['notes', 'Notes'], ['chat', 'Chat']];
  $('#tabs').innerHTML = t.map(([id, name]) => `<button class="${S.tab === id ? 'on' : ''}" data-tab="${id}" aria-current="${S.tab === id ? 'page' : 'false'}">${ico(I[id])}${name}</button>`).join('');
}
function render() { document.body.classList.toggle('nohints', !S.hints); $('#mic').classList.toggle('on', S.listening); renderMain(); renderDock(); renderTabs(); }

function sheet(html) { $('#layer').innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; }
function close() { $('#layer').innerHTML = ''; }

let lastTap = { i: -1, t: 0 };
document.addEventListener('click', e => {
  const el = e.target.closest('button, [data-i], .ref, #scrim'); if (!el) return;
  const d = el.dataset;
  if (el.id === 'scrim' && e.target === el) return close();
  if (d.i !== undefined && !el.matches('button')) {
    const i = +d.i;
    // Double-tap a search result to open it in its chapter
    if (S.tab === 'search' && lastTap.i === i && Date.now() - lastTap.t < 400) { const r = FAITH[i]; return r[2] ? openAt(r[2], r[3]) : toast(`Opens ${r[0]} in its chapter.`); }
    lastTap = { i, t: Date.now() };
    if (S.playing) stop();
    S.sel.has(i) ? S.sel.delete(i) : S.sel.add(i); return render();
  }
  if (el.classList.contains('ref')) return d.ref.startsWith('Psalm') ? openAt('Psalms 23', 3) : openAt('Hebrews 11', 5);
  if (d.tab) return setTab(d.tab);
  if (d.h) return d.h === 'Psalm 23' ? openAt('Psalms 23') : d.h === 'Hebrews 11' ? openAt('Hebrews 11') : search(d.h);
  if (d.mode) { S.mode = d.mode; return render(); }
  if (d.list !== undefined) { S.list = +d.list; S.sel.clear(); return render(); }
  if (d.note !== undefined) { S.note = +d.note; return render(); }
  if (d.book) { close(); return d.book === 'Psalms' ? openAt('Psalms 23') : d.book === 'Hebrews' ? openAt('Hebrews 11') : toast('The Book · Chapter · Verse wheels open here.'); }
  if (d.soon) { close(); return toast(d.soon); }
  switch (el.id) {
    case 'mic':
      if (S.listening) return;
      S.listening = true; render(); $('#q').value = ''; $('#q').placeholder = 'Listening…';
      { let k = 0; const w = 'faith'; const tick = setInterval(() => { k++; $('#q').value = w.slice(0, k); if (k >= w.length) { clearInterval(tick); setTimeout(() => { S.listening = false; $('#q').placeholder = 'Search a word, or John 3:16'; search(w); }, 400); } }, 170); }
      return;
    case 'prev': return openAt(ORDER[ORDER.indexOf(S.at) - 1]);
    case 'next': return openAt(ORDER[ORDER.indexOf(S.at) + 1]);
    case 'pick': return sheet(`<h3>Go to</h3><div class="chips">${['Genesis', 'Psalms', 'Proverbs', 'Isaiah', 'Matthew', 'John', 'Romans', 'Hebrews'].map(b => `<button data-book="${b}">${b}</button>`).join('')}</div>`);
    case 'tr': return sheet(`<h3>Translation</h3><button class="opt" data-soon="KJV is on.">KJV</button><button class="opt" data-soon="KJV with Strong’s numbers.">KJV+S</button><button class="opt" data-soon="Reina-Valera, with the app in Spanish.">RV1909<small>Español</small></button>`);
    case 'settings': return sheet(`<h3>Settings</h3>
      <button class="opt" data-soon="Voice picker.">Reading voice<small>Heart ›</small></button>
      <button class="opt" data-soon="Colour picker: all 13 themes, 7 of them neon.">Colours<small>Neon Book ›</small></button>
      <button class="opt" id="hints">Hints<span class="sw ${S.hints ? 'on' : ''}" role="switch" aria-checked="${S.hints}"></span></button>
      <button class="opt" data-soon="Opens your phone’s share menu.">Share Voice Bible<small>›</small></button>
      <button class="opt" data-soon="Save or restore your lists, notes and chats.">Backup<small>›</small></button>`);
    case 'hints': S.hints = !S.hints; close(); render(); return toast(S.hints ? 'Hints on.' : 'Hints off.');
    case 'play': if (S.playing) { stop(); return render(); } return play();
    case 'playsel': return play([...S.sel].sort((a, b) => a - b));
    case 'repeat': S.repeat = !S.repeat; return render();
    case 'speed': { const sp = [0.75, 1, 1.25, 1.5, 2]; S.speed = sp[(sp.indexOf(S.speed) + 1) % sp.length]; return render(); }
    case 'more': return sheet(`<h3>Playback</h3><button class="opt" id="refs">Say the reference first<span class="sw on" role="switch" aria-checked="true"></span></button><button class="opt" data-soon="Voice picker.">Reading voice<small>Heart ›</small></button>`);
    case 'refs': el.querySelector('.sw').classList.toggle('on'); return;
    case 'save': { const n = S.sel.size; S.sel.clear(); render(); return sheet(`<h3>Save ${n} to…</h3><div class="chips">${LISTS.map(l => `<button data-soon="Added to ${esc(l.name)}.">${esc(l.name)}</button>`).join('')}<button data-soon="A name box appears.">＋ New list</button></div>`); }
    case 'tonote': { S.sel.clear(); render(); return sheet(`<h3>Add to a note</h3><div class="chips">${NOTES.map(x => `<button data-soon="Added to ${esc(x.title)}.">${esc(x.title)}</button>`).join('')}<button data-soon="Added to a new note.">＋ New note</button></div>`); }
    case 'share': S.sel.clear(); render(); return toast('Opens your phone’s share menu with the verses.');
    case 'clear': S.sel.clear(); return render();
    case 'edit': S.editing = !S.editing; return render();
    case 'back-lists': stop(); S.list = null; S.sel.clear(); return render();
    case 'back-notes': S.note = null; return render();
    case 'newlist': return toast('A name box appears.');
    case 'newnote': S.note = 0; return render();
  }
  if (el.classList.contains('del')) return toast('Asks “Delete?” before it goes.');
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset?.i !== undefined) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape') close();
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'sform') { const v = $('#q').value.trim(); if (/^psalms? 23$/i.test(v)) return openAt('Psalms 23'); if (/^hebrews 11$/i.test(v)) return openAt('Hebrews 11'); return search(v || 'faith'); }
  if (e.target.id === 'cform') { const v = $('#cq').value.trim(); if (!v) return; CHAT.push(['me', v], ['ai', 'This is a prototype, so answers aren’t live here. In the app, ChatGPT answers with tappable references like [Psalm 23:4].']); render(); $('#main').scrollTop = $('#main').scrollHeight; }
});
render();
</script>
