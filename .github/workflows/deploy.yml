name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Served at the root of its own address, voicebible.eefavorbooks.com (the repo's Pages custom domain)
          BASE_PATH: /
          # Cloudflare R2 bucket holding the Natural voice recordings (scripts/upload-audio.sh)
          VITE_AUDIO_BASE: https://pub-5a66f38c566346e2a958c9e52686537e.r2.dev/
      # SPA fallback so deep links and refreshes don't 404
      - run: cp dist/index.html dist/404.html
      # ClipForge also lives at /clipforge/ (same address, so the teleprompter can hand it videos).
      # Its code is in a private repo; the live, already-public page is copied in. ClipForge's deploy.sh re-runs this.
      - run: mkdir -p dist/clipforge && curl -fsSL --retry 3 https://clipforge.eefavorbooks.com/ -o dist/clipforge/index.html && grep -q "CF_VERSION" dist/clipforge/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
